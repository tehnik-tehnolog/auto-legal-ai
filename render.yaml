services:
  - type: web
    name: rag-auto-raskat
    runtime: node
    plan: free
    autoDeploy: true
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: LLM_MODEL_NAME
        value: gemini-4-hydrogen
      - key: WEBHOOK_BASE_URL
        sync: false
      - key: HOST
        sync: false
      - key: DB_PORT
        value: "6543"
      - key: USER
        sync: false
      - key: PASSWORD
        sync: false
      - key: B2_ENDPOINT
        sync: false
      - key: B2_KEY_ID
        sync: false
      - key: B2_APPLICATION_KEY
        sync: false
      - key: B2_REGION
        value: eu-central-003
      - key: B2_BUCKET_NAME
        sync: false
